name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        name: Lint, test and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run release
            - uses: actions/upload-artifact@v4
              with:
                  name: widget-mpk
                  path: dist/*/*.mpk

    compliance:
        name: Secrets and licenses
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Scan for secrets (gitleaks)
              env:
                  GITLEAKS_VERSION: 8.21.2
              run: |
                  curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
                  ./gitleaks git . --no-banner --redact --verbose
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Check licenses of bundled dependencies
              run: >
                  npx --yes license-checker-rseidelsohn@4 --production --excludePackagesStartingWith worldmap@
                  --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;Apache-2.0"
