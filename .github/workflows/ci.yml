name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot keeps them up to date.
jobs:
    build:
        name: Lint, test and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            # Runs lint first (the prerelease script).
            - run: npm run release
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: widget-mpk
                  path: dist/*/*.mpk

    compliance:
        name: Secrets and licenses
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
            # gitleaks is downloaded and checked against a pinned SHA-256 before it runs. To update it, take the
            # linux_x64 line from the release's gitleaks_<version>_checksums.txt.
            - name: Scan for secrets (gitleaks)
              env:
                  GITLEAKS_VERSION: 8.30.1
                  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              run: |
                  archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
                  echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
                  tar xzf "$archive" gitleaks
                  ./gitleaks git . --no-banner --redact --verbose
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # license-checker-rseidelsohn is a devDependency, so its version comes from the lockfile.
            - name: Check licenses of bundled dependencies
              run: >
                  npx --no-install license-checker-rseidelsohn --production --excludePackagesStartingWith worldmap@
                  --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;Apache-2.0"
